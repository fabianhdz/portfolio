name: Deploy to GitHub Pages

on:
  # Run on every push to the main branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions needed for the GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v6
        with:
          path: portfolio

      - name: Checkout Scrawler
        uses: actions/checkout@v6
        with:
          repository: fabianhdz/scrawler
          ref: main
          path: scrawler
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scrawler/package-lock.json

      - name: Install Scrawler dependencies
        working-directory: scrawler
        run: npm ci

      - name: Build Scrawler
        working-directory: scrawler
        run: npm run build

      - name: Include Scrawler at /scrawler/
        run: cp -R scrawler/dist portfolio/scrawler

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: portfolio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
